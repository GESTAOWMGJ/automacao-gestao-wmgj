<style>
  :root {
    --ink:#173139; --teal:#123f48; --teal-2:#1e6670; --cream:#f7f2e9; --paper:#fffdf8;
    --gold:#b99755; --gold-on-dark:#e4bd70; --gold-on-light:#73551f; --focus:#005fcc;
    --red:#a63737; --amber:#9a641c; --green:#2d6a4f; --line:#c8c2b7;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none!important; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
  h1,h2,p { margin-top:0; }
  h1 { max-width:24ch; font-family:Georgia,serif; font-size:clamp(1.7rem,4vw,3rem); line-height:1.05; }
  h2 { font-size:1.05rem; }
  .sr-only { position:absolute!important; width:1px!important; height:1px!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0,0,0,0)!important; white-space:nowrap!important; border:0!important; }
  .skip-link { position:absolute; left:-9999px; top:0; }
  .skip-link:focus { left:1rem; top:1rem; z-index:20; background:white; color:var(--ink); padding:.75rem; outline:3px solid var(--focus); }
  .topbar { display:flex; justify-content:space-between; gap:2rem; align-items:flex-end; padding:clamp(1.25rem,4vw,3rem); background:var(--teal); color:white; border-bottom:4px solid var(--gold); }
  .title-block { min-width:0; }
  .eyebrow { margin-bottom:.45rem; font-size:.72rem; letter-spacing:.14em; font-weight:800; color:var(--gold-on-light); }
  .topbar .eyebrow { color:var(--gold-on-dark); }
  .topbar-status { display:flex; align-items:flex-end; gap:1rem; }
  .connection { display:grid; justify-items:end; gap:.42rem; font-size:.78rem; max-width:48rem; }
  .status-pair { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:.45rem; }
  .badge { display:inline-flex; align-items:center; border:1px solid currentColor; border-radius:999px; padding:.3rem .6rem; font-weight:800; }
  .badge-live,.badge-healthy { color:#bde8cf; }
  .badge-stale,.badge-loading,.badge-partial,.badge-unknown { color:#ffe0a6; }
  .badge-degraded { color:#ffd1a8; }
  .badge-offline,.badge-error { color:#ffc5c5; }
  main { max-width:1440px; margin:auto; padding:clamp(1rem,3vw,2rem); }
  .metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1rem; margin-bottom:.75rem; }
  .metric,.panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 22px rgba(20,49,57,.06); }
  .metric { min-height:112px; padding:1.1rem; display:flex; flex-direction:column; justify-content:space-between; }
  .metric span { font-size:.82rem; }
  .metric strong { font-family:Georgia,serif; font-size:2.25rem; }
  .metric-primary { border-top:4px solid var(--gold); }
  .scope-note,.component-status { margin:0 0 .65rem; padding:0 .1rem; color:#435a60; font-size:.8rem; line-height:1.45; }
  .component-status { margin-bottom:1rem; }
  .workspace { display:grid; grid-template-columns:minmax(0,2fr) minmax(280px,1fr); gap:1rem; }
  .panel { padding:1.1rem; }
  .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .side-stack { display:grid; gap:1rem; align-content:start; }
  .button,select { min-height:44px; border:1px solid #68777a; border-radius:9px; background:white; color:var(--ink); padding:.55rem .75rem; font:inherit; }
  .button { cursor:pointer; font-weight:700; }
  .button:focus-visible,select:focus-visible,.table-wrap:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  .topbar .button:focus-visible { outline-color:var(--gold-on-dark); }
  .button-primary { background:var(--teal); color:white; border-color:var(--teal); }
  .button-topbar { flex:0 0 auto; }
  .button-compact { min-height:44px; padding:.4rem .65rem; }
  .filters { display:grid; grid-template-columns:1fr 1fr auto; gap:.75rem; align-items:end; background:#f0ece4; border-radius:10px; padding:.9rem; margin-bottom:.75rem; }
  .filters label { display:grid; gap:.3rem; font-size:.82rem; font-weight:700; }
  .filter-actions { display:flex; gap:.5rem; }
  .filter-summary { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1rem; margin-bottom:.75rem; padding:.65rem .75rem; background:#f3efe7; border-left:4px solid var(--teal-2); border-radius:8px; font-size:.8rem; }
  #queue-count { flex:1 1 18rem; }
  .table-wrap { overflow:auto; max-height:560px; border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; min-width:670px; }
  th,td { text-align:left; padding:.78rem; border-bottom:1px solid var(--line); font-size:.82rem; overflow-wrap:anywhere; }
  th { position:sticky; top:0; background:#eee8dc; z-index:1; }
  tbody tr:focus-within,tbody tr:hover { background:#f5f0e7; }
  .empty-cell { color:#53666b; text-align:center; }
  .risk { display:inline-flex; min-width:76px; justify-content:center; border-radius:999px; padding:.25rem .5rem; font-weight:800; border:1px solid currentColor; }
  .risk-unknown { color:#6b2130; border-style:dashed; }
  .risk-critical { color:var(--red); }
  .risk-high { color:#8c4b18; }
  .risk-medium { color:var(--amber); }
  .risk-low { color:var(--green); }
  .bars { display:grid; gap:.8rem; }
  .bar-row { display:grid; grid-template-columns:90px 1fr 42px; align-items:center; gap:.6rem; font-size:.8rem; }
  .bar-track { height:10px; background:#d9d3c9; border-radius:999px; overflow:hidden; }
  .bar-fill { display:block; height:100%; background:var(--teal-2); border-radius:inherit; }
  .bar-row[data-alert="true"] .bar-fill { background:var(--red); }
  .caveat { margin:1rem 0 0; color:#53666b; font-size:.78rem; }
  .error { margin-top:1rem; padding:1rem; background:#fff0f0; border:1px solid #c66; border-radius:10px; }

  @media (max-width:820px) {
    .topbar { align-items:flex-start; flex-direction:column; gap:1rem; }
    .topbar-status { width:100%; align-items:flex-start; justify-content:space-between; }
    .connection { justify-items:start; }
    .status-pair { justify-content:flex-start; }
    .metrics { display:flex; overflow-x:auto; gap:.65rem; padding:.15rem .15rem .55rem; scroll-snap-type:x proximity; }
    .metric { min-width:150px; min-height:88px; padding:.85rem; scroll-snap-align:start; }
    .metric strong { font-size:1.8rem; }
    .workspace { grid-template-columns:1fr; }
    .panel-main { order:0; }
    .side-stack { order:1; grid-template-columns:1fr 1fr; }
    .filters { grid-template-columns:1fr; }
  }

  @media (max-width:600px) {
    .topbar-status { display:grid; }
    .button-topbar { justify-self:start; }
    .side-stack { grid-template-columns:1fr; }
    .panel { padding:.85rem; }
    .filter-summary { align-items:flex-start; }
    #queue-count { flex-basis:100%; }
    .table-wrap { max-height:none; overflow:visible; border:0; }
    table { min-width:0; }
    thead { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    tbody { display:grid; gap:.65rem; }
    tbody tr { display:block; background:#fff; border:1px solid var(--line); border-radius:9px; padding:.35rem .65rem; }
    tbody td { display:grid; grid-template-columns:minmax(86px,.8fr) minmax(0,1.2fr); gap:.65rem; padding:.55rem 0; border-bottom:1px solid #e3ddd3; }
    tbody td:last-child { border-bottom:0; }
    tbody td::before { content:attr(data-label); color:#435a60; font-size:.72rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase; }
    tbody td.empty-cell { display:block; padding:.8rem; border:0; text-align:left; }
    tbody td.empty-cell::before { content:none; }
    .bar-row { grid-template-columns:82px 1fr 34px; gap:.45rem; }
  }

  @page { size:A4 landscape; margin:10mm; }

  @media print {
    body { background:white; color:#000; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
    .skip-link,.button,.filters { display:none!important; }
    .topbar { display:flex; align-items:flex-end; padding:0 0 8mm; background:white; color:#000; border-bottom:2px solid #000; }
    .topbar .eyebrow,.eyebrow { color:#543f18; }
    .topbar-status { display:block; }
    .connection { color:#000; justify-items:end; }
    .badge { color:#000!important; }
    main { max-width:none; padding:8mm 0 0; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); overflow:visible; }
    .metric,.panel { box-shadow:none; }
    .metric,.side-stack .panel { break-inside:avoid; }
    .panel-main { break-inside:auto; }
    .workspace { display:block; }
    .side-stack { display:grid; grid-template-columns:1fr 1fr; margin-top:6mm; }
    .table-wrap { max-height:none; overflow:visible; }
    table { min-width:0; }
    thead { position:static; width:auto; height:auto; padding:0; margin:0; overflow:visible; clip:auto; white-space:normal; }
    tbody { display:table-row-group; }
    tbody tr { display:table-row; border:0; padding:0; break-inside:avoid; }
    tbody td { display:table-cell; padding:.55rem; border-bottom:1px solid #999; }
    tbody td::before { display:none; content:none; }
    th { position:static; background:#eee; color:#000; }
    .filter-summary { border:1px solid #777; }
    .caveat,.scope-note,.component-status { color:#222; }
  }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; }
  }
</style>
